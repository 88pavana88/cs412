{% extends 'mini_fb/base.html' %}

{% block content %}
<h2>Post a status message for {{ profile.first_name }} {{ profile.last_name }}</h2>

<form action="{% url 'create_status' profile.pk %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
        <tr>
            <th><label for="files">Upload image(s):</label></th>
            <td><input type="file" name="files" multiple></td>
        </tr>
    </table>

    <input type="submit" value="Create Status">

    <a href="{% url 'show_profile' profile.pk %}">
        <button type="button">Cancel</button>
    </a>
</form>
{% endblock %}
