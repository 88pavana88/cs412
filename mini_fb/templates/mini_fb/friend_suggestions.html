{% extends 'mini_fb/base.html' %}

{% block content %}
<h2>People {{ profile.first_name }} {{ profile.last_name }} may know:</h2>

<div style="display: flex; gap: 20px; flex-wrap: wrap;">
    {% for suggestion in suggestions %}
    <div style="text-align: center;">
        <a href="{% url 'add_friend' suggestion.pk %}">
            <button>Add Friend</button>
        </a>
        <a href="{% url 'show_profile' suggestion.pk %}">
            {% if suggestion.profile_image_url %}
            <img src="{{ suggestion.profile_image_url }}" alt="{{ suggestion.first_name }}" width="100">
            {% endif %}
            <p>{{ suggestion.first_name }} {{ suggestion.last_name }}</p>
        </a>
    </div>
    {% endfor %}
</div>

<br>
<a href="{% url 'show_profile' profile.pk %}">
    <button>Back to Profile</button>
</a>
{% endblock %}
