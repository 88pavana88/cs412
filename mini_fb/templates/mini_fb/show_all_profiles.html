{% extends 'mini_fb/base.html' %}

{% block content %}

<h1>All Profiles</h1>
<main class="grid-container">
    <!-- making  user's profile pic link to their profile page if they have a pic -->
    {% for profile in profiles %}
    <article>
        {% if profile.profile_image_url %}
        <a href="{% url 'show_profile' profile.pk %}">
        <img src="{{ profile.profile_image_url }}" alt="Profile pic">
        </a>
        {% endif %}
        <div>
            <!-- making  user's name link to their profile page -->
            <h2><a href="{% url 'show_profile' profile.pk %}">{{ profile.first_name }} {{ profile.last_name }}</a></h2>
            <strong>City: {{ profile.city }}</strong>
            <p>Email: {{ profile.email }}</p>
        </div>
    </article>
    {% endfor %}
</main>

{% endblock %}
