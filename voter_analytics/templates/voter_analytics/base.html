<head>
<style>
  body {
  background: #e2bcd8;
  font-family: Arial;
  font-size: 19.5px;
  font-weight: bold;
  text-align: center;
  margin: 0;
}

h1 {
  color: #c1075e;
  font-size: 60px;
  margin-top: 20px;
}

h2 {
  color: #753c56;
  font-size: 38px;
  margin-top: 10px;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 20px;
  background: #f3d9e6;
  border-radius: 10px;
  box-shadow: 0 2px 8px #753c56;
}

form table {
  width: 100%;
  margin-bottom: 30px;
}

th, td {
  padding: 10px;
  text-align: left;
  border: none;
}

select, input[type="checkbox"], input[type="submit"] {
  font-family: inherit;
  font-size: 16px;
  padding: 5px;
  margin-top: 5px;
}

input[type="submit"] {
  background-color: #c1075e;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  cursor: pointer;
}

input[type="submit"]:hover {
  background-color: #a2064f;
}

table.voter-list {
  width: 100%;
  border-collapse: collapse;
  background-color: white;
  border-radius: 8px;
  overflow: hidden;
}

table.voter-list th, table.voter-list td {
  border: 2px solid #c1075e;
  padding: 10px;
  text-align: center;
}

.pagination {
  margin: 20px 0;
}

.pagination a {
  color: #c1075e;
  margin: 0 10px;
  text-decoration: none;
  font-weight: bold;
}
</style>

<body>
  <header>
    <nav>
      <ul>
        <li><a href="{% url 'voters' %}">Show voter list</a></li>
      
      </ul>
    </nav>
  </header>
  {% block content %}
  {% endblock %}
</head>
</body>
</html>
