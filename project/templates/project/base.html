-->

{% load static %}
<!DOCTYPE html>
<html>
<head>
  <!-- setting page title and loading css -->
  <title>Nail Salon</title>
  <link rel="stylesheet" href="{% static 'nail_salon.css' %}">
</head>
<body>
  <!-- creating navigation bar -->
  <div class="navbar">
    <img id="logo" src="{% static 'logo.png' %}" alt="Nail Salon Logo">
    <div class="nav-links">
      <a href="{% url 'service_list' %}" class="nav-link">Services</a>
      <a href="{% url 'reviews' %}" class="nav-link">Reviews</a>
      {% if user.is_authenticated %}
        <a href="{% url 'my_appointments' %}" class="nav-link">My Appointments</a>
        <!-- adding logout feature -->
        <form method="post" action="{% url 'logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="nav-link">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="nav-link">Login</a>
        <a href="{% url 'register' %}" class="nav-link">Register</a>
      {% endif %}
    </div>
  </div>
  <!-- showing login status -->
  {% if user.is_authenticated %}
    <p class="login-status">Logged in as <strong>{{ user.username }}</strong></p>
  {% else %}
    <p class="login-status">Not logged in</p>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
