{% extends 'quotes/base.html' %}
{% load static %}  

{% block title %}All Quotes{% endblock %}

{% block content %}
<div>
    <h1>All Quotes</h1>
    {% for quote in quotes %}
        <p>"{{ quote }}"</p>
    {% endfor %}
    
    <h1>All Images</h1>
    {% for image in images %}
        <img src="{% static image %}" alt="Pitbull">
    {% endfor %}
</div>
{% endblock %}
